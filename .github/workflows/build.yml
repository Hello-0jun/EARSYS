name: Release EARSYS

on:
  push:
    tags:
      - "v*"           # v0.2.0, v1.0.0 등 태그 푸시 시 자동 실행
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능

jobs:
  # ---------------------------------------------------------------------------
  # 소스 아카이브 생성 및 GitHub Release 첨부
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      # 버전 태그 추출
      - name: 버전 추출
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # 필요한 파일만 골라 tar.gz 아카이브 생성
      - name: 소스 아카이브 생성
        run: |
          tar -czf earsys-${{ steps.version.outputs.tag }}.tar.gz \
            earsys/ \
            main.py \
            pyproject.toml \
            requirements.txt \
            scripts/ \
            face_landmarker.task

      - name: GitHub Release 생성 및 파일 첨부
        uses: softprops/action-gh-release@v2
        with:
          files: earsys-${{ steps.version.outputs.tag }}.tar.gz
