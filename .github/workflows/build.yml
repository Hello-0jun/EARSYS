name: Release EARSYS

on:
  push:
    tags:
      - "v*"           # Automatically run when a tag such as v0.2.0 or v1.0.0 is pushed
  workflow_dispatch:   # Can be run manually from the Actions tab

jobs:
  # ---------------------------------------------------------------------------
  # Build a source archive and attach it to the GitHub Release
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Extract the version tag
      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # Create a tar.gz archive with only the required files
      - name: Create source archive
        run: |
          tar -czf earsys-${{ steps.version.outputs.tag }}.tar.gz \
            earsys/ \
            main.py \
            pyproject.toml \
            requirements.txt \
            scripts/ \
            face_landmarker.task

      - name: Create GitHub Release and attach archive
        uses: softprops/action-gh-release@v2
        with:
          files: earsys-${{ steps.version.outputs.tag }}.tar.gz
