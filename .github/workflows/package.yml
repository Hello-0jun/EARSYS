name: EARSYS Package & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package (e.g. v0.3.0)"
        required: true

permissions:
  contents: write   # GitHub Release 생성 권한

jobs:
  build:
    name: Build wheel & sdist
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      # dist/ 에 생성된 .whl, .tar.gz 를 다음 job에서 사용
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: List built packages
        run: ls -lh dist/

      - name: Extract version tag
        id: version
        run: |
          # 태그 push: refs/tags/v0.3.0  →  v0.3.0
          # 수동 실행: inputs.tag 사용
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "EARSYS ${{ steps.version.outputs.tag }}"
          body: |
            ## Installation

            **Raspberry Pi / Linux (aarch64 / x86_64)**
            ```bash
            pip install earsys-${{ steps.version.outputs.tag }}-py3-none-any.whl
            ```

            Or from source distribution:
            ```bash
            pip install earsys-${{ steps.version.outputs.tag }}.tar.gz
            ```

            > **Note:** `face_landmarker.task` is not bundled.  
            > Download it separately from [MediaPipe Models](https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task)
            > and place it in the project root, or set `EARSYS_MODEL_PATH`.
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
